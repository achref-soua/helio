packages:
  - apps/*
  - packages/*
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  better-sqlite3: false
  cpu-features: false
  esbuild: true
  lefthook: true
  prisma: true
  protobufjs: false
  sharp: true
  ssh2: false
minimumReleaseAgeExclude:
  - '@better-auth/api-key@1.6.15'
  - '@better-auth/core@1.6.15'
  - '@better-auth/drizzle-adapter@1.6.15'
  - '@better-auth/kysely-adapter@1.6.15'
  - '@better-auth/memory-adapter@1.6.15'
  - '@better-auth/mongo-adapter@1.6.15'
  - '@better-auth/prisma-adapter@1.6.15'
  - '@better-auth/sso@1.6.15'
  - '@better-auth/telemetry@1.6.15'
  - better-auth@1.6.15
overrides:
  kysely: ^0.28.17
  # Security (Dependabot): bump vulnerable transitive versions. protobufjs
  # and postcss already resolve safe copies elsewhere in the tree; these
  # ranges unify the stragglers. @hono/node-server is scoped to the 1.x line
  # so the safe direct 2.x dependency isn't downgraded.
  # protobufjs < 7.6.3: prototype pollution via crafted .proto/reflection
  # (GHSA-f38q-mgvj-vph7) — reaches us through @opentelemetry → @grpc.
  protobufjs: ^7.6.3
  postcss: ^8.5.10
  '@hono/node-server@1': '>=1.19.13 <2'
  # esbuild < 0.28.1: dev-server arbitrary file read (Windows) + Deno-module
  # RCE via NPM_CONFIG_REGISTRY (GHSA-gv7w-rqvm-qjhr, GHSA-g7r4-m6w7-qqqr).
  esbuild: ^0.28.1
  # js-yaml < 4.1.2: quadratic-complexity DoS in merge-key handling via
  # repeated aliases (GHSA-h67p-54hq-rp68) — dev-only, via openapi-typescript.
  js-yaml: ^4.1.2
  # undici < 7.28.0: TLS cert-validation bypass, WebSocket DoS, cross-origin
  # request routing. Reaches the prod tree only through better-auth's
  # mis-declared vitest → jsdom (test tooling, not a runtime path); unify it
  # to a patched copy regardless.
  undici: ^7.28.0
  # hono < 4.12.25: CORS middleware reflects any Origin with credentials +
  # serve-static path traversal. Direct api/ingest/tracking already declare
  # ^4.12.25; this lifts the lingering transitive copy too.
  hono: ^4.12.25
